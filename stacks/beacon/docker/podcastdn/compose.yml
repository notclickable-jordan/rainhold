services:
    app:
        image: jordanroher/podcastdn:latest@sha256:ce7670a0bcd0fa5272aa2dfdb66501d97f57acdf35d1e7028df927eeef3cc325
        container_name: podcastdn
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped
        volumes:
            - tmp:/tmp/podcast
        networks:
            - caddy
            - backend

    db:
        image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
        container_name: podcastdn_db
        env_file:
            - .env
        volumes:
            - db:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        networks:
            - backend

volumes:
    db:
    tmp:

networks:
    caddy:
        external: true
    backend:
