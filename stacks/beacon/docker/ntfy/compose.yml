services:
    ntfy:
        image: binwiederhier/ntfy
        container_name: ntfy
        restart: unless-stopped
        command: serve --config /etc/ntfy/server.yml
        env_file:
            - .env
        ports:
            # Host-only: notification scripts on the VM publish here.
            - 127.0.0.1:4217:80
        volumes:
            - ./server.yml:/etc/ntfy/server.yml:ro
            - cache:/var/cache/ntfy
            - data:/var/lib/ntfy
        networks:
            - caddy

volumes:
    cache:
    data:

networks:
    caddy:
        external: true
