services:
    freshrss:
        image: freshrss/freshrss:latest@sha256:af44385229541bee24aa9148d0ff8f3b40e095373c63a2c0f74e09a27d3c59df
        container_name: freshrss
        env_file:
            - .env
        restart: unless-stopped
        networks:
            - caddy
        volumes:
            - data:/var/www/FreshRSS/data
            - extensions:/var/www/FreshRSS/extensions
        deploy:
            resources:
                limits:
                    memory: 256m

volumes:
    data:
    extensions:

networks:
    caddy:
        external: true
