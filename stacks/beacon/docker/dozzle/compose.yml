services:
    dozzle:
        image: amir20/dozzle:latest
        container_name: dozzle
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - dozzle_data:/data
        environment:
            - DOZZLE_AUTH_PROVIDER=forward-proxy
            - DOZZLE_ENABLE_ACTIONS=true
            - DOZZLE_ENABLE_SHELL=true
        networks:
            - caddy
        deploy:
            resources:
                limits:
                    memory: 256m

volumes:
    dozzle_data:
        driver: local

networks:
    caddy:
        external: true
