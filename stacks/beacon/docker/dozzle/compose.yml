services:
    dozzle:
        image: amir20/dozzle:latest@sha256:244f218c876d6ed766277e71a537f34bfb2c01829e1927737e3673a8327deeb8
        container_name: dozzle
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - dozzle_data:/data
        environment:
            - DOZZLE_AUTH_PROVIDER=forward-proxy
            - DOZZLE_ENABLE_ACTIONS=true
            - DOZZLE_ENABLE_SHELL=true
        networks:
            - dozzle
        deploy:
            resources:
                limits:
                    memory: 256m

volumes:
    dozzle_data:
        driver: local

networks:
    dozzle:
        external: true
