services:
    lldap:
        image: lldap/lldap:stable@sha256:2a8454b668c1aba7157e832eab0e242e1e7eb5fb7591d7e7774ba05286511ca8
        container_name: lldap
        restart: unless-stopped
        volumes:
            - lldap_data:/data
        env_file:
            - .env
        networks:
            - caddy
        deploy:
            resources:
                limits:
                    memory: 128m

volumes:
    lldap_data:
        driver: local

networks:
    caddy:
        external: true
