# Mastodon Postgres client authentication.
# The volume was initialised with POSTGRES_HOST_AUTH_METHOD=trust, which let any
# network client log in without a password. This file overrides that.

# Unix socket (docker exec ... psql, rotate-secrets) stays passwordless.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# Everything over the network must present a password. md5 also accepts
# SCRAM-stored passwords (and negotiates SCRAM for them).
host    all             all             all                     md5
