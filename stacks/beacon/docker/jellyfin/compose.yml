services:
    jellyfin:
        image: jellyfin/jellyfin:latest@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
        container_name: jellyfin
        user: 1000:1000
        volumes:
            - config:/config
            - cache:/cache
            - /mnt/media:/media
            - /mnt/erotica:/erotica
        restart: unless-stopped
        ports:
            - 8096:8096
        environment:
            - JELLYFIN_PublishedServerUrl=https://jellyfin.notclickable.com
        networks:
            - caddy
        deploy:
            resources:
                limits:
                    memory: 3g

volumes:
    cache:
    config:

networks:
    caddy:
        external: true
