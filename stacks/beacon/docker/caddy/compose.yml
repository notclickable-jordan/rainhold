services:
    caddy:
        image: jordanroher/caddy-cloudflare-dns
        container_name: caddy
        restart: unless-stopped
        cap_add:
            - NET_ADMIN
        networks:
            - caddy
            - dozzle
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - ./conf:/etc/caddy
            - data:/data
            - config:/config
        deploy:
            resources:
                limits:
                    memory: 256m

volumes:
    data:
    config:

networks:
    caddy:
        external: true
    dozzle:
        external: true
