x-logging: &default-logging
    driver: "json-file"
    options:
        max-size: "50m"
        max-file: "4"

services:
    nginx:
        image: nginx:1-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
        container_name: lemmy-nginx
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro,Z
            - ./proxy_params:/etc/nginx/proxy_params:ro,Z
        restart: unless-stopped
        logging: *default-logging
        depends_on:
            - pictrs
            - lemmy-ui
        networks:
            - caddy
        deploy:
            resources:
                limits:
                    memory: 64m

    lemmy:
        image: dessalines/lemmy:0.19.20@sha256:79e9f02c286c324a779faa6b9d36bb47a2ed17caa2656c5b91101254bd1269d9
        container_name: lemmy
        hostname: lemmy
        restart: unless-stopped
        logging: *default-logging
        environment:
            - RUST_LOG=warn
        volumes:
            - ./lemmy.hjson:/config/config.hjson:Z
        depends_on:
            - postgres
            - pictrs
        networks:
            - caddy
            - backend
        deploy:
            resources:
                limits:
                    memory: 512m

    lemmy-ui:
        image: dessalines/lemmy-ui:0.19.20@sha256:ee4c620d8e933ab0266b8aaf0e78247455ab70a90eeb86f1548b7e2aa87c9d40
        container_name: lemmy-ui
        env_file:
            - .env
        volumes:
            - extra_themes:/app/extra_themes
        depends_on:
            - lemmy
        restart: unless-stopped
        logging: *default-logging
        networks:
            - caddy
        deploy:
            resources:
                limits:
                    memory: 512m

    pictrs:
        image: asonix/pictrs:0.5.25@sha256:6c64d7d282b67931716861b92bce48392791b57b571f5b7bbe132a10b4f0c39e
        container_name: lemmy-pictrs
        hostname: pictrs
        env_file:
            - .env.pictrs
        user: 991:991
        volumes:
            - pictrs:/mnt
        restart: unless-stopped
        logging: *default-logging
        deploy:
            resources:
                limits:
                    memory: 512m
        networks:
            - backend

    postgres:
        image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
        container_name: lemmy-db
        hostname: postgres
        env_file:
            - .env.postgres
        volumes:
            - postgres:/var/lib/postgresql/data
        restart: unless-stopped
        logging: *default-logging
        networks:
            - backend
        deploy:
            resources:
                limits:
                    memory: 1g

volumes:
    extra_themes:
    pictrs:
    postgres:

networks:
    caddy:
        external: true
    backend:
