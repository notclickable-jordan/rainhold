services:
    gitea:
        image: docker.gitea.com/gitea:28.3.0@sha256:8967bf9deaf3c5c4adae13519436dc1b20c646ac83fe37ae810c933a1045227d
        container_name: gitea
        env_file:
            - .env
        restart: unless-stopped
        volumes:
            - data:/data
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        depends_on:
            - db
        ports:
            - 4209:22
        networks:
            - caddy
            - backend
            - gitea-runner
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
        deploy:
            resources:
                limits:
                    memory: 2g

    db:
        image: docker.io/library/postgres:14@sha256:c0e9c0e9bac7e4c1834b698217a03ee5c708de30d313c84a506972de0e24b059
        restart: unless-stopped
        container_name: gitea-db
        networks:
            - backend
        env_file:
            - .env
        volumes:
            - db:/var/lib/postgresql/data
        deploy:
            resources:
                limits:
                    memory: 512m

    runner:
        image: gitea/act_runner:latest@sha256:b5c35d6bdbb9bb25e531230bfc7cc663cb751406cbec90a2a891b85fea54de86
        container_name: gitea-runner
        networks:
            - gitea-runner
        env_file:
            - .env.runner
        restart: unless-stopped
        depends_on:
            gitea:
                condition: service_healthy
        volumes:
            - ./runner.yml:/config.yaml
            - /var/run/docker.sock:/var/run/docker.sock
            - runner_data:/data
            - runner_cache:/root/.cache/act
        deploy:
            resources:
                limits:
                    memory: 512m

volumes:
    data:
    db:
    runner_data:
    runner_cache:

networks:
    caddy:
        external: true
    backend:
    gitea-runner:
        name: gitea-runner
