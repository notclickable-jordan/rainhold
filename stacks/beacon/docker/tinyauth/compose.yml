services:
    tinyauth:
        image: ghcr.io/steveiliop56/tinyauth:v3@sha256:6fb523a7bda58f1e6072c3a1c4bc0186ae0c45e79802ca6ac7d21136775807f3
        container_name: tinyauth
        restart: unless-stopped
        env_file:
            - .env
        networks:
            - caddy
        deploy:
            resources:
                limits:
                    memory: 128m

networks:
    caddy:
        external: true
