---
# Rotate secrets that a normal `ansible-playbook playbook.yml` run will NOT
# pick up on its own: Postgres role passwords (only applied at first
# container init), the Cloudflare Tunnel token (only installed once), the
# root password, and optionally the Tailscale auth key.
#
# Usage:
#   1. Rotate each credential at its source first (Cloudflare dashboard,
#      AWS IAM, SMTP provider, etc.) and update ansible/inventory/host_vars/
#      beacon.yml with the new values.
#   2. Run:
#        ansible-playbook rotate-secrets.yml
#
# This re-renders every templated .env/config file with the new values,
# rotates the Postgres passwords in-place inside the still-running database
# containers so they match, re-installs the Cloudflare tunnel with the new
# token, sets the new root password, and finally restarts every Docker stack
# so all apps pick up the rotated credentials.
- name: Rotate Rainhold secrets
  hosts: public
  become: true
  roles:
    - role: docker-env
    - role: rotate-secrets
    - role: docker-start
