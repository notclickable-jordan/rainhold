---
# Role: cloudflared
# Purpose: Install Cloudflared and configure a tunnel

- name: Ensure /usr/share/keyrings exists
  file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

- name: Add Cloudflare GPG key
  ansible.builtin.get_url:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /usr/share/keyrings/cloudflare-main.gpg
    mode: "0644"

- name: Add Cloudflared apt repository
  ansible.builtin.deb822_repository:
    name: cloudflared
    types: deb
    uris: https://pkg.cloudflare.com/cloudflared
    suites: any
    components: main
    signed_by: /usr/share/keyrings/cloudflare-main.gpg

- name: Remove legacy Cloudflared repository source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/cloudflared.list
    state: absent

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes

- name: Install cloudflared
  ansible.builtin.apt:
    name: cloudflared
    state: present

# The tunnel is token-managed (ingress lives in the Cloudflare dashboard), so
# no local config is needed. Remove the old placeholder config, which exposed
# the tunnel token in a world-readable file.
- name: Remove legacy cloudflared configuration file
  file:
    path: "/etc/cloudflared/config.yml"
    state: absent

- name: Check if cloudflared is already logged in
  stat:
    path: /etc/systemd/system/cloudflared.service
  register: cloudflared_service

- name: Login to Cloudflare Tunnel (using token)
  command: >
    cloudflared service install {{ cloudflared_token }}
  when: not cloudflared_service.stat.exists
  args:
    creates: /etc/systemd/system/cloudflared.service

- name: Enable and start cloudflared service
  systemd:
    name: cloudflared
    enabled: yes
    state: started
    daemon_reload: yes
