---
- name: Get list of subdirectories under stacks/{{ rainhold_stack }}/docker
  find:
    paths: "{{ rainhold_dest }}/stacks/{{ rainhold_stack }}/docker"
    file_type: directory
    depth: 1
  register: rainhold_docker_dirs

- name: Check if compose.yml exists in each subdirectory
  stat:
    path: "{{ item.path }}/compose.yml"
  loop: "{{ rainhold_docker_dirs.files }}"
  register: compose_yml_stat

# --force-recreate (rather than down + up) still picks up changes to
# bind-mounted config files such as the Caddyfile and lemmy.hjson, but
# leaves a stack running if the new configuration fails to start.
- name: Recreate docker services in each subdirectory
  command: docker compose up -d --force-recreate --remove-orphans
  args:
    chdir: "{{ item.item.path }}"
  loop: "{{ compose_yml_stat.results }}"
  when: item.stat.exists
